ardupilot_waypoint_mission:
  ros__parameters:
    use_sim_time: true

    # The launch file overrides waypoint_file with the same YAML used by Nav2.
    waypoint_file: ""

    # Same geodetic origin as worlds/tecnofest_asv_course.sdf. The waypoint
    # YAML is in ENU meters, then converted to WGS84 for ArduPilot missions.
    origin_lat_deg: -6.200000
    origin_lon_deg: 106.816666
    origin_alt_m: 0.0
    mission_alt_m: 0.0

    # Larger ASV waypoint radius prevents turning back after the boat has
    # already passed a waypoint near the correct path.
    waypoint_radius_m: 7.00
    waypoint_passed_margin_m: 2.00
    waypoint_passed_cross_track_m: 20.00
    waypoint_recede_skip_enabled: true
    waypoint_recede_skip_radius_m: 14.00
    waypoint_recede_skip_margin_m: 3.00
    final_waypoint_progress_fraction: 0.85
    enable_passed_waypoint_skip: true

    auto_upload: true
    clear_existing_mission: true
    set_current_index: 0

    # Supported values are any ArduRover mode accepted by MAVROS/ArduPilot,
    # especially AUTO, GUIDED, RTL, HOLD, and MANUAL.
    mode_before_arm: "GUIDED"
    mode_after_upload: "AUTO"
    arm_vehicle: true
    force_arm_if_needed: true
    rtl_on_finish: false

    mavros_namespace: "/mavros"
    mission_service_namespace: "/mavros/mavros"
    command_service_namespace: "/mavros/mavros"
    mode_service_namespace: "/mavros"
    connection_timeout_s: 120.0
    service_timeout_s: 60.0
    status_period_s: 1.0
